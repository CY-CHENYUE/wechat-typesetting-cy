<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨夜散步 — 四门通过示例</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 80px;
    background: #ededed;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  .toolbar {
    position: sticky; top: 12px; z-index: 10;
    max-width: 677px; margin: 0 auto 8px;
    background: #fff; border-radius: 12px; padding: 12px 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,.10);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .toolbar button {
    border: none; border-radius: 8px; padding: 9px 16px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #copy-btn { background: #07c160; color: #fff; }
  #width-btn { background: #f2f2f2; color: #333; }
  .hint { font-size: 12px; color: #888; }
  .wrapper {
    max-width: 677px; margin: 0 auto;
    background: #152238;
    box-shadow: 0 2px 24px rgba(0,0,0,.08);
  }
  body.phone .wrapper { max-width: 375px; }
</style>
</head>
<body>
<div class="toolbar">
  <button id="copy-btn" onclick="copyContent()">一键复制到公众号</button>
  <button id="width-btn" onclick="document.body.classList.toggle('phone')">手机宽度</button>
  <span class="hint">复制后粘贴到公众号编辑器，再做手机预览</span>
</div>
<div class="wrapper">
<div id="wechat-content">
<!-- 风格方向: 自定义·墨蓝雨幕缓行 | 备选: 雾灰极简 / 暖灯棕金 -->
<section data-role="outer" style="background-color: #152238; padding: 0;">
  <table width="100%" cellspacing="0" cellpadding="0" border="0"
         style="border-collapse: collapse; border-spacing: 0; background-color: #152238; border: none;">
    <tr>
      <td style="background-color: #152238; padding: 40px 24px 32px; border: none;">
        <p style="margin: 0 0 12px 0;">
          <span data-layout-text="true" style="font-size: 12px; color: #89a7c2; letter-spacing: 3px;">NIGHT WALK</span>
        </p>
        <p style="margin: 0; line-height: 1.22; text-align: left;">
          <span style="font-family: Baskerville, Georgia, 'Songti SC', serif; font-size: 38px; font-weight: 700; color: #eaf0f5; letter-spacing: 2px;">雨夜散步</span>
        </p>
        <section style="width: 100%; height: 1px; background-color: #89a7c2; margin: 26px 0 0;"></section>
      </td>
    </tr>
    <tr>
      <td style="background-color: #152238; padding: 20px 24px 10px; border: none;">
        <p style="margin: 0; font-size: 16px; line-height: 1.9; letter-spacing: 1px; color: #eaf0f5; text-align: justify;">雨落在伞面上。</p>
      </td>
    </tr>
    <tr>
      <td style="background-color: #152238; padding: 18px 54px 48px; border: none;">
        <p style="margin: 0; font-size: 16px; line-height: 1.9; letter-spacing: 1px; color: #eaf0f5; text-align: left;">我走得比平时慢。</p>
      </td>
    </tr>
    <tr>
      <td style="background-color: #152238; padding: 24px 24px 36px; border: none; text-align: center;">
        <p style="margin: 0;">
          <span data-layout-text="true" style="font-size: 12px; color: #89a7c2; letter-spacing: 6px;">— END —</span>
        </p>
      </td>
    </tr>
  </table>
</section>
</div>
</div>
<script>
async function copyContent() {
  const el = document.getElementById('wechat-content');
  const btn = document.getElementById('copy-btn');
  let ok = false;
  // 首选 Clipboard API：同时写入 text/html 与 text/plain
  try {
    const item = new ClipboardItem({
      'text/html': new Blob([el.innerHTML], { type: 'text/html' }),
      'text/plain': new Blob([el.innerText], { type: 'text/plain' })
    });
    await navigator.clipboard.write([item]);
    ok = true;
  } catch (e) { /* 走兜底 */ }
  // 兜底：选区复制（与手动全选复制等效）
  if (!ok) {
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    ok = document.execCommand('copy');
    sel.removeAllRanges();
  }
  if (ok) {
    btn.classList.add('done');
    btn.textContent = '✓ 已复制，去编辑器粘贴';
    setTimeout(() => { btn.classList.remove('done'); btn.textContent = '一键复制到公众号'; }, 3000);
  } else {
    alert('自动复制失败：请手动选中下方全部内容后复制');
  }
}
</script>
</body>
</html>
